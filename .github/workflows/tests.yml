name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        # The suite is fully offline: conftest stubs WorkspaceClient + the Azure DI SDK,
        # and every warehouse call is faked. No Databricks credentials are required.
        run: pytest
